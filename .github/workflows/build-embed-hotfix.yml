name: Build Figranium Embed hotfix

on:
  push:
    branches:
      - fix/embed-browser-runtime

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: figranium/figranium-embed
          path: .embed-build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: .embed-build
      - run: npm run build
        working-directory: .embed-build
      - run: |
          mkdir -p images/figranium-embed
          cp .embed-build/dist/csr/figranium-embed.csr.js images/figranium-embed/figranium-embed.csr.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f images/figranium-embed/figranium-embed.csr.js
          git diff --cached --quiet || git commit -m "Build self-contained Figranium Embed bundle"
          git push
