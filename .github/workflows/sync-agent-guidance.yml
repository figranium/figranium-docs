name: Sync MCP agent guidance

on:
  push:
    paths:
      - '.github/workflows/sync-agent-guidance.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update MCP integration guidance
        shell: python
        run: |
          from pathlib import Path

          path = Path('mcp-integration.mdx')
          text = path.read_text()

          text = text.replace(
              '- Always insert a `wait_selector` step **before** performing any interactive actions (e.g. `click` or `type`) to ensure the target element is loaded in the DOM.\n',
              '- Add `wait_selector` only when readiness actually requires it. Do not add waits automatically before every interaction.\n- Prefer native Figranium actions over JavaScript, and avoid redundant `navigate`, wait, loop, or `start` / “On Execution” blocks when task-level behavior already covers them.\n'
          )

          text = text.replace(
              '- Declare dynamic values and intermediate data inside the task\'s `variables` object.\n- Initiate runs via the `task_execute` tool, and pass variable overrides to change defaults dynamically during execution.\n',
              '- Task-level `variables` are inputs/configuration that callers may override before execution. Do not use task variables as final output fields.\n- Use `set` for runtime or mid-task state needed by later blocks; it may create or update a runtime variable.\n- Values that depend on execution time, such as “today”, “last 7 days”, or “past 90 days”, must remain dynamic rather than being hard-coded during task creation.\n- Initiate runs via the `task_execute` tool, and pass variable overrides to change defaults dynamically during execution.\n\n### 5. Source, Extraction, and Result Validation\n\n- Prefer the simplest native workflow that reliably satisfies the request. Do not add actions or configuration that serve no concrete purpose.\n- When no source is specified, choose one that directly represents the requested data. Prefer structured first-party/public APIs when they reliably provide the needed information.\n- Final structured output, including table parsing/extraction, must be implemented in the task-level `extractionScript` field. Do not treat task variables or ordinary JavaScript action blocks as final extraction output.\n- When extracting lists, return consistently structured records and remove obvious duplicates when appropriate.\n- Unless the user explicitly asks not to test, execute a created or updated task and inspect the actual returned result. A `success` execution status alone is not enough.\n- Verify that the output meaningfully satisfies the request. If it is empty, malformed, irrelevant, duplicated, unexpectedly null, or otherwise incorrect, fix the task and execute it again.\n- Preserve reasonable implementation ambiguity, avoid inventing unnecessary requirements, and make sensible implementation decisions when needed to complete the task.\n'
          )

          path.write_text(text)
      - name: Commit changes and remove one-shot workflow
        run: |
          rm .github/workflows/sync-agent-guidance.yml
          git config user.name "Aser Nasr"
          git config user.email "asernasr@figranium.dev"
          git add mcp-integration.mdx .github/workflows/sync-agent-guidance.yml
          git commit -m "docs: align MCP agent guidance"
          git push
